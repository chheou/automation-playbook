# tasks/redhat.yml — Red Hat / CentOS / Rocky / AlmaLinux task definitions
#
# Changes from original:
#   [Fix 1] Added: Check Available Updates task (dnf/yum check-update)
#   [Fix 2] Added: Patch / Full Update task (dnf/yum update -y)
#   [Fix 3] Added: Check Reboot Required task (needs-restarting / rpm -q)
#   [Fix 4] Added: Reboot & verify task (reboot + wait + uptime)
#   [Fix 5] Zabbix server IP moved to a clearly labelled comment for easy update
#   [Fix 6] max_workers tuned per task risk level

# ── CONFIG ──────────────────────────────────────────────────────────────────
# Zabbix server IP — update here if the monitoring server changes
# ZABBIX_SERVER: 172.17.1.155
# ────────────────────────────────────────────────────────────────────────────

tasks:

  # -------------------------------------------------------------------------
  # INFO
  # -------------------------------------------------------------------------
  - name: Check OS
    type: ssh
    category: info
    max_workers: 20
    commands:
      - label: OS Version
        command: cat /etc/os-release 2>/dev/null || cat /etc/redhat-release 2>/dev/null || uname -a
        parser: os_release

  # -------------------------------------------------------------------------
  # CHECK AVAILABLE UPDATES  [Fix 1]
  # -------------------------------------------------------------------------
  - name: Check Updates Redhat
    type: ssh
    category: info
    max_workers: 20
    commands:
      - label: List available updates
        command: >
          if command -v dnf >/dev/null 2>&1;
          then dnf check-update --quiet 2>/dev/null; echo "EXIT:$?";
          else yum check-update --quiet 2>/dev/null; echo "EXIT:$?";
          fi
        parser: first_line
      - label: Count available updates
        command: >
          if command -v dnf >/dev/null 2>&1;
          then dnf check-update --quiet 2>/dev/null | grep -v "^$" | grep -v "^Last" | wc -l;
          else yum check-update --quiet 2>/dev/null | grep -v "^$" | grep -v "^Loaded" | wc -l;
          fi
        parser: first_line

  # -------------------------------------------------------------------------
  # PATCH — Full system update  [Fix 2]
  # -------------------------------------------------------------------------
  - name: Patch Redhat
    type: ssh
    category: patch
    max_workers: 5
    commands:
      - label: Pre-patch snapshot (installed packages count)
        command: rpm -qa | wc -l
        parser: first_line
      - label: Clean package cache
        command: >
          if command -v dnf >/dev/null 2>&1;
          then dnf clean all;
          else yum clean all;
          fi
        parser: first_line
      - label: Apply all updates
        command: >
          if command -v dnf >/dev/null 2>&1;
          then dnf update -y;
          else yum update -y;
          fi
        parser: first_line
      - label: Post-patch snapshot (installed packages count)
        command: rpm -qa | wc -l
        parser: first_line
      - label: Check reboot required after patch
        command: >
          if command -v needs-restarting >/dev/null 2>&1;
          then needs-restarting -r >/dev/null 2>&1 && echo "REBOOT_NOT_REQUIRED" || echo "REBOOT_REQUIRED";
          else rpm -q --last kernel | head -1 | grep -q "$(uname -r)" && echo "REBOOT_NOT_REQUIRED" || echo "REBOOT_REQUIRED";
          fi
        parser: first_line

  # -------------------------------------------------------------------------
  # CHECK REBOOT REQUIRED  [Fix 3]
  # -------------------------------------------------------------------------
  - name: Check Reboot Status Redhat
    type: ssh
    category: reboot
    max_workers: 20
    commands:
      - label: Reboot required check
        command: >
          if command -v needs-restarting >/dev/null 2>&1;
          then needs-restarting -r >/dev/null 2>&1 && echo "REBOOT_NOT_REQUIRED" || echo "REBOOT_REQUIRED";
          else rpm -q --last kernel | head -1 | grep -q "$(uname -r)" && echo "REBOOT_NOT_REQUIRED" || echo "REBOOT_REQUIRED";
          fi
        parser: first_line
      - label: Current kernel
        command: uname -r
        parser: first_line
      - label: Latest installed kernel
        command: rpm -q --last kernel | head -1 | awk '{print $1}' | sed 's/kernel-//'
        parser: first_line
      - label: Current uptime
        command: uptime -p 2>/dev/null || uptime
        parser: first_line

  # -------------------------------------------------------------------------
  # REBOOT & VERIFY  [Fix 4]
  # -------------------------------------------------------------------------
  - name: Reboot Servers Redhat
    type: ssh
    category: reboot
    max_workers: 5
    commands:
      - label: Record uptime before reboot
        command: uptime
        parser: first_line
      - label: Initiate reboot
        command: shutdown -r +0 "Scheduled reboot by patcher" &
        parser: first_line

  # Post-reboot verify runs after reconnect — handled by Python module
  # modules.redhat.reboot_servers() waits for SSH recovery then calls:
  #   - uname -r          → confirm new kernel loaded
  #   - uptime            → confirm fresh boot
  #   - needs-restarting -r → confirm reboot no longer required

  # -------------------------------------------------------------------------
  # INSTALL — Zabbix Agent  [Fix 5] IP labelled clearly
  # -------------------------------------------------------------------------
  - name: Install Zabbix Agent Redhat
    type: ssh
    category: install
    max_workers: 10
    commands:
      - label: Install Zabbix repository
        command: >
          rhel_ver=$(rpm -E %{rhel});
          rpm -q zabbix-release >/dev/null 2>&1 ||
          rpm -Uvh https://repo.zabbix.com/zabbix/6.4/rhel/${rhel_ver}/x86_64/zabbix-release-6.4-1.el${rhel_ver}.noarch.rpm
        parser: first_line
      - label: Install package
        command: >
          if command -v dnf >/dev/null 2>&1;
          then dnf clean all && dnf install -y zabbix-agent;
          else yum clean all && yum install -y zabbix-agent;
          fi
        parser: first_line
      - label: Configure Zabbix server (172.17.1.155)
        command: >
          sed -i 's/^Server=.*/Server=172.17.1.155/' /etc/zabbix/zabbix_agentd.conf &&
          sed -i 's/^ServerActive=.*/ServerActive=172.17.1.155/' /etc/zabbix/zabbix_agentd.conf
        parser: first_line
      - label: Enable and start service
        command: systemctl enable zabbix-agent && systemctl restart zabbix-agent
        parser: first_line
      - label: Verify service is active
        command: systemctl is-active zabbix-agent
        parser: first_line